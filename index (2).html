<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kvíz – stavba bunky</title>
  <meta name="description" content="Kvíz na učenie častí prokaryotickej, rastlinnej a živočíšnej bunky.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <header class="head">
      <h1>Stavba bunky</h1>
      <p class="sub">Doplň alebo vyber správne názvy častí bunky.</p>
    </header>

    <section class="controls" aria-label="Nastavenia kvízu">
      <div class="seg" id="tabs" role="group" aria-label="Typ bunky"></div>
      <div class="seg" id="modes" role="group" aria-label="Režim">
        <button type="button" data-mode="choice" aria-pressed="true">Výber z možností</button>
        <button type="button" data-mode="type" aria-pressed="false">Písanie</button>
      </div>
    </section>

    <section class="bar">
      <div class="scorebox">
        <div class="score" id="score" aria-live="polite"></div>
        <div class="meter" aria-hidden="true"><i id="meter"></i></div>
      </div>
      <div class="actions">
        <button type="button" class="btn primary" id="btnCheck" hidden>Skontrolovať</button>
        <button type="button" class="btn" id="btnReveal">Ukázať riešenie</button>
        <button type="button" class="btn" id="btnReset">Znova</button>
      </div>
    </section>

    <p class="note" id="note" aria-live="polite" hidden></p>
    <p class="scrollhint" id="scrollhint" hidden>↔ Obrázok môžeš posúvať do strán.</p>

    <div class="scroller" id="scroller">
      <figure class="board" id="board">
        <img id="img" alt="" draggable="false">
        <div class="slots" id="slots"></div>
      </figure>
    </div>
  </div>

  <div class="picker" id="picker" hidden>
    <div class="picker-in">
      <div class="picker-head">
        <strong>Vyber správny názov</strong>
        <button type="button" class="btn small" id="pickClose">Zavrieť (Esc)</button>
      </div>
      <div class="opts" id="opts"></div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
